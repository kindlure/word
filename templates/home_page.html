<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asosiy Sahifa</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwind-ga dark rejimni 'class' orqali boshqarishni buyuramiz (Oq rejim ishlamasligining asosiy yechimi)
        tailwind.config = {
            darkMode: 'class'
        }

        // Sahifa yuklanishidan oldin mavzuni tekshirish (Tezkorlik va miltillashni oldini olish uchun)
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <!-- Font Awesome Ikonkalari -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Silliq o'tish effekti uchun maxsus klass */
        .theme-transition, .theme-transition * {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
        }
    </style>
</head>
<body class="theme-transition min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 flex items-center justify-center px-4 py-12 selection:bg-emerald-500 selection:text-white">

    <div class="max-w-2xl w-full relative">

        <!-- Yuqori qism: Salomlashish va Rejim Tugmasi -->
        <div class="flex items-center justify-between mb-8 px-2">
            <div class="text-left">
                <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-2">
                    Salom, <span class="text-emerald-600 dark:text-yellow-400 drop-shadow-sm">{{name}}</span>! 👋
                </h1>
                <p class="text-lg text-gray-600 dark:text-gray-400 font-medium">
                    Ingliz tilini o‘rganishni yanada qiziqarli qilamiz
                </p>
            </div>

            <!-- Rejimni o'zgartirish tugmasi (Zamonaviy dizaynda) -->
            <button id="theme-toggle" aria-label="Mavzuni o'zgartirish"
                class="w-12 h-12 flex items-center justify-center text-xl bg-white dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-700 dark:text-yellow-400 border border-gray-200 dark:border-gray-800 rounded-2xl shadow-sm hover:shadow active:scale-95 transition-all duration-200 cursor-pointer focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <i id="theme-icon" class="fas fa-moon"></i>
            </button>
        </div>

        <!-- Asosiy Blok (Card) -->
        <div class="bg-white dark:bg-gray-900 rounded-3xl p-8 md:p-12 shadow-xl shadow-gray-200/50 dark:shadow-none border border-gray-100 dark:border-gray-850">
            <h2 class="text-2xl md:text-3xl font-bold mb-10 leading-snug text-gray-800 dark:text-gray-200">
                Bu yerda siz so‘zlarni <span class="text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/30 px-2 py-0.5 rounded-xl">test orqali</span>
                yodlab, keyin ularni <span class="text-violet-600 dark:text-violet-400 bg-violet-50 dark:bg-violet-950/30 px-2 py-0.5 rounded-xl">takrorlab</span> mustahkamlashingiz mumkin.
            </h2>

            <!-- Tugmalar/Havolalar qatori -->
            <div class="space-y-5">

                <!-- 1-Havola: 4000 Words -->
                <a href="/4000_essential_english_words/"
                   class="group flex items-center justify-between bg-gray-50 hover:bg-emerald-50/60 dark:bg-gray-950/40 dark:hover:bg-emerald-950/20 border border-gray-200 dark:border-gray-800 hover:border-emerald-500 dark:hover:border-emerald-500 rounded-2xl p-6 text-left transition-all duration-300 shadow-sm hover:shadow-md">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 flex items-center justify-center bg-emerald-100 dark:bg-emerald-900/40 text-3xl rounded-xl group-hover:scale-110 transition-transform duration-300">
                            📚
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 dark:text-white group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">
                                4000 Essential English Words
                            </h3>
                            <p class="text-gray-500 dark:text-gray-400 text-sm mt-0.5 font-medium">Eng muhim 4000 so‘z • 6 daraja</p>
                        </div>
                    </div>
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 group-hover:border-emerald-500 dark:group-hover:border-emerald-500 transition-colors">
                        <i class="fas fa-arrow-right text-lg text-gray-400 dark:text-gray-500 group-hover:text-emerald-500 dark:group-hover:text-emerald-400 group-hover:translate-x-1 transition-all"></i>
                    </div>
                </a>

                <!-- 2-Havola: Sozlamalar -->
                <a href="/settings/"
                   class="group flex items-center justify-between bg-gray-50 hover:bg-violet-50/60 dark:bg-gray-950/40 dark:hover:bg-violet-950/20 border border-gray-200 dark:border-gray-800 hover:border-violet-500 dark:hover:border-violet-500 rounded-2xl p-6 text-left transition-all duration-300 shadow-sm hover:shadow-md">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 flex items-center justify-center bg-violet-100 dark:bg-violet-900/40 text-3xl rounded-xl group-hover:scale-110 transition-transform duration-300">
                            ⚙️
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 dark:text-white group-hover:text-violet-600 dark:group-hover:text-violet-400 transition-colors">
                                Sozlamalar
                            </h3>
                            <p class="text-gray-500 dark:text-gray-400 text-sm mt-0.5 font-medium">Profil, til, bildirishnomalar</p>
                        </div>
                    </div>
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 group-hover:border-violet-500 dark:group-hover:border-violet-500 transition-colors">
                        <i class="fas fa-arrow-right text-lg text-gray-400 dark:text-gray-500 group-hover:text-violet-500 dark:group-hover:text-violet-400 group-hover:translate-x-1 transition-all"></i>
                    </div>
                </a>

            </div>
        </div>
    </div>

    <!-- JavaScript - Eng sodda va tez ishlaydigan mantiq -->
    <script>
        const toggleBtn = document.getElementById('theme-toggle');
        const icon = document.getElementById('theme-icon');

        // Ikonkani yangilash (Dark rejimda quyosh, Light rejimda oy chiqadi)
        function updateIcon(isDark) {
            if (isDark) {
                icon.className = 'fas fa-sun text-yellow-400';
            } else {
                icon.className = 'fas fa-moon text-gray-700';
            }
        }

        // Dastlabki holatda ikonkani to'g'rilash
        updateIcon(document.documentElement.classList.contains('dark'));

        // Tugma bosilganda klik hodisasi
        toggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateIcon(isDark);
        });
    </script>
</body>
</html>
