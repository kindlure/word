<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Essential</title>
    <!-- Poppins Shrifti va Unicons Ikonkalari -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">

    <style>
       :root {
          --white: #ffffff;
          --light: #f0eff3;
          --black: #000000;
          --dark-blue: #0a0421;
          --dark-light: #1f1a3a;
          --red: #da2c4d;
          --yellow: #f8ab37;
          --grey: #ecedf3;
          --text-color: #ffffff;
          --input-bg: rgba(255, 255, 255, 0.05);
          --input-border: rgba(255, 255, 255, 0.1);
          --label-color: #00ff62;
       }

       /* Oq rejim o'zgaruvchilari */
       [data-theme="light"] {
          --bg-color: #f4f6f9;
          --dark-blue: #f4f6f9;
          --dark-light: #ffffff;
          --text-color: #2d3436;
          --input-bg: #ffffff;
          --input-border: #cbd5e1;
          --label-color: #0984e3;
       }

       * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
       }

       body {
          width: 100%;
          background: var(--dark-blue);
          font-family: 'Poppins', sans-serif;
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 40px 20px;
          color: var(--text-color);
       }

       /* === Rejim Almashtirgich (Theme Toggle) === */
       .theme-switch-wrapper {
          position: absolute;
          top: 25px;
          right: 25px;
          display: flex;
          align-items: center;
          gap: 10px;
          z-index: 100;
       }
       .theme-switch {
          display: inline-block;
          height: 30px;
          position: relative;
          width: 60px;
       }
       .theme-switch input { display: none; }
       .slider {
          background-color: var(--dark-light);
          bottom: 0; cursor: pointer; left: 0; position: absolute; right: 0; top: 0;
          border-radius: 34px; display: flex; align-items: center;
          justify-content: space-between; padding: 0 8px; font-size: 14px;
          border: 1px solid var(--input-border);
       }
       .slider:before {
          background: linear-gradient(138deg, var(--red), var(--yellow));
          bottom: 3px; content: ""; height: 22px; left: 4px; position: absolute;
          width: 22px; border-radius: 50%; transition: 0.3s;
       }
       input:checked + .slider:before { transform: translateX(28px); }

       /* === Orqaga tugmasi === */
       .btn-back {
          position: absolute;
          top: 25px;
          left: 25px;
          color: var(--label-color);
          text-decoration: none;
          font-weight: 600;
          font-size: 1.1rem;
          display: flex;
          align-items: center;
          gap: 5px;
       }
       .btn-back:hover { opacity: 0.8; }

       /* === Asosiy Konteyner === */
       .container {
          max-width: 600px;
          width: 100%;
          background: var(--dark-light);
          border: 1px solid var(--input-border);
          padding: 40px;
          border-radius: 24px;
          box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
          text-align: center;
       }

       .title-section {
          margin-bottom: 30px;
       }
       .title-section h1, .title-section h2 {
          font-size: 1.8rem;
          font-weight: 700;
       }

       /* === Form elementlari === */
       .form-group {
          margin-bottom: 25px;
          text-align: left;
       }
       .form-row {
          display: flex;
          gap: 15px;
          margin-bottom: 20px;
       }
       .form-row .form-group { flex: 1; }

       label {
          display: block;
          color: var(--label-color);
          font-weight: 500;
          margin-bottom: 8px;
          font-size: 0.95rem;
       }

       input[type="number"] {
          width: 100%;
          padding: 14px 18px;
          background: var(--input-bg);
          border: 2px solid var(--input-border);
          border-radius: 12px;
          color: var(--text-color);
          font-family: 'Poppins', sans-serif;
          font-size: 1rem;
          font-weight: 500;
          outline: none;
       }
       input[type="number"]:focus {
          border-color: var(--yellow);
       }

       /* === Radio (Language) kartochkalari === */
       .radio-group {
          display: flex;
          gap: 15px;
          margin: 30px 0;
       }
       .radio-box {
          flex: 1;
          position: relative;
       }
       .radio-box input[type="radio"] {
          position: absolute;
          opacity: 0;
          width: 0; height: 0;
       }
       .radio-label {
          display: block;
          padding: 20px;
          text-align: center;
          background: var(--input-bg);
          border: 2px solid var(--input-border);
          border-radius: 12px;
          cursor: pointer;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 1px;
          color: var(--text-color);
       }
       .radio-box input[type="radio"]:checked + .radio-label {
          background: linear-gradient(138deg, var(--red), var(--yellow));
          color: #fff;
          border-color: transparent;
          box-shadow: 0 8px 20px rgba(218, 44, 77, 0.3);
       }

       /* === Start Tugmasi (Mukammal Mukofot ko'rinishida) === */
       .btn-start {
          width: 100%;
          padding: 16px;
          background: linear-gradient(138deg, var(--red), var(--yellow));
          border: none;
          border-radius: 12px;
          color: #fff;
          font-family: 'Poppins', sans-serif;
          font-size: 1.2rem;
          font-weight: 700;
          letter-spacing: 2px;
          cursor: pointer;
          box-shadow: 0 5px 15px rgba(218, 44, 77, 0.3);
          text-transform: uppercase;
       }
       .btn-start:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 25px rgba(218, 44, 77, 0.5);
       }
       .btn-start:active { transform: translateY(0); }

       /* Kuchli moslashuvchanlik */
       @media (max-width: 500px) {
          .form-row { flex-direction: column; gap: 0; }
          .container { padding: 30px 20px; }
          .radio-group { flex-direction: column; }
       }
    </style>
</head>
<body>

  <!-- Orqaga qaytish havolasi -->
  <a href="/4000_essential_english_words/" class="btn-back">⬅️ Back</a>

  <!-- Rejim almashtirgich -->
  <div class="theme-switch-wrapper">
    <label class="theme-switch" for="checkbox">
        <input type="checkbox" id="checkbox" />
        <div class="slider">
            <span>🌙</span>
            <span>☀️</span>
        </div>
    </label>
  </div>

  <div class="container">

      <!-- Sarlavhalar va Django xabarlari -->
      <div class="title-section">
          {% if success %}
             <h2 style="color: var(--red);">To suit your taste:</h2>
          {% else %}
             <h1 style="color: var(--red);">{{message}}</h1>
          {% endif %}
      </div>

      <!-- Toza va Validatsiyadan o'tgan Form HTML -->
      <form action="/query_essential_1/" method="post">
          {% csrf_token %}

          <div class="form-row">
              <div class="form-group">
                  <label>From Unit:</label>
                  <input type="number" name="from_unit" value="1" min="1" max="30">
              </div>

              <div class="form-group">
                  <label>To Unit:</label>
                  <input type="number" name="to_unit" value="30" min="1" max="30">
              </div>
          </div>

          <div class="form-group">
              <label>Number of tests (Amount):</label>
              <input type="number" name="amount" value="5" min="1">
          </div>

          <!-- Tarjima yo'nalishlari (Chiroyli Kartochkalar) -->
          <div class="radio-group">
              <div class="radio-box">
                  <input type="radio" name="language" id="language-eng" value="eng-uzb" checked>
                  <label class="radio-label" for="language-eng">eng - uzb</label>
              </div>
              <div class="radio-box">
                  <input type="radio" name="language" id="language-uzb" value="uzb-eng">
                  <label class="radio-label" for="language-uzb">uzb - eng</label>
              </div>
          </div>

          <!-- Zamonaviy mukammal START tugmasi -->
          <button type="submit" class="btn-start">Start Quiz</button>
      </form>

  </div>

  <!-- Rejimni boshqarish (JS) -->
  <script>
    const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
        document.documentElement.setAttribute('data-theme', currentTheme);
        if (currentTheme === 'light') {
            toggleSwitch.checked = true;
        }
    }

    function switchTheme(e) {
        if (e.target.checked) {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    }

    toggleSwitch.addEventListener('change', switchTheme, false);
  </script>

</body>
</html>
