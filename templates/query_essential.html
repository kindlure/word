<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Essential</title>
    <!-- Poppins Shrifti va Unicons Ikonkalari -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">

    <style>
       :root {
          --white: #ffffff;
          --light: #f0eff3;
          --black: #000000;
          --dark-blue: #0a0421;
          --dark-light: #1f1a3a;
          --red: #da2c4d;
          --yellow: #f8ab37;
          --grey: #ecedf3;
          --text-color: #ffffff;
          --input-bg: rgba(255, 255, 255, 0.05);
          --input-border: rgba(255, 255, 255, 0.1);
          --label-color: #00ff62;
       }

       /* Oq rejim o'zgaruvchilari */
       [data-theme="light"] {
          --bg-color: #f4f6f9;
          --dark-blue: #f4f6f9;
          --dark-light: #ffffff;
          --text-color: #2d3436;
          --input-bg: #ffffff;
          --input-border: #cbd5e1;
          --label-color: #0984e3;
       }

       * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
       }

       body {
          width: 100%;
          background: var(--dark-blue);
          font-family: 'Poppins', sans-serif;
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 40px 20px;
          color: var(--text-color);
       }

       /* === Rejim Almashtirgich (Theme Toggle) === */
       .theme-switch-wrapper {
          position: absolute;
          top: 25px;
          right: 25px;
          display: flex;
          align-items: center;
          gap: 10px;
          z-index: 100;
       }
       .theme-switch {
          display: inline-block;
          height: 30px;
          position: relative;
          width: 60px;
       }
       .theme-switch input { display: none; }
       .slider {
          background-color: var(--dark-light);
          bottom: 0; cursor: pointer; left: 0; position: absolute; right: 0; top: 0;
          border-radius: 34px; display: flex; align-items: center;
          justify-content: space-between; padding: 0 8px; font-size: 14px;
          border: 1px solid var(--input-border);
       }
       .slider:before {
          background: linear-gradient(138deg, var(--red), var(--yellow));
          bottom: 3px; content: ""; height: 22px; left: 4px; position: absolute;
          width: 22px; border-radius: 50%; transition: 0.3s;
       }
       input:checked + .slider:before { transform: translateX(28px); }

       /* === Orqaga tugmasi === */
       .btn-back {
          position: absolute;
          top: 25px;
          left: 25px;
          color: var(--label-color);
          text-decoration: none;
          font-weight: 600;
          font-size: 1.1rem;
          display: flex;
          align-items: center;
          gap: 5px;
       }
       .btn-back:hover { opacity: 0.8; }

       /* === Asosiy Konteyner === */
       .container {
          max-width: 600px;
          width: 100%;
          background: var(--dark-light);
          border: 1px solid var(--input-border);
          padding: 40px;
          border-radius: 24px;
          box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
          text-align: center;
       }

       .title-section {
          margin-bottom: 30px;
       }
       .title-section h2 {
          font-size: 1.8rem;
          font-weight: 700;
       }

       /* Dinamik xabarlar paneli */
       .alert-message {
          padding: 12px;
          margin-bottom: 20px;
          border-radius: 8px;
          font-size: 0.95rem;
          font-weight: 500;
          display: none;
       }
       .alert-danger { background-color: rgba(218, 44, 77, 0.2); color: #ff4d6d; border: 1px solid var(--red); }
       .alert-success { background-color: rgba(0, 255, 98, 0.2); color: #00ff62; border: 1px solid #00ff62; }

       /* === Form elementlari === */
       .form-group {
          margin-bottom: 25px;
          text-align: left;
       }
       .form-row {
          display: flex;
          gap: 15px;
          margin-bottom: 20px;
       }
       .form-row .form-group { flex: 1; }

       label {
          display: block;
          color: var(--label-color);
          font-weight: 500;
          margin-bottom: 8px;
          font-size: 0.95rem;
       }

       input[type="number"] {
          width: 100%;
          padding: 14px 18px;
          background: var(--input-bg);
          border: 2px solid var(--input-border);
          border-radius: 12px;
          color: var(--text-color);
          font-family: 'Poppins', sans-serif;
          font-size: 1rem;
          font-weight: 500;
          outline: none;
       }
       input[type="number"]:focus {
          border-color: var(--yellow);
       }

       /* === Radio (Language) kartochkalari === */
       .radio-group {
          display: flex;
          gap: 15px;
          margin: 30px 0;
       }
       .radio-box {
          flex: 1;
          position: relative;
       }
       .radio-box input[type="radio"] {
          position: absolute;
          opacity: 0;
          width: 0; height: 0;
       }
       .radio-label {
          display: block;
          padding: 20px;
          text-align: center;
          background: var(--input-bg);
          border: 2px solid var(--input-border);
          border-radius: 12px;
          cursor: pointer;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 1px;
          color: var(--text-color);
       }
       .radio-box input[type="radio"]:checked + .radio-label {
          background: linear-gradient(138deg, var(--red), var(--yellow));
          color: #fff;
          border-color: transparent;
          box-shadow: 0 8px 20px rgba(218, 44, 77, 0.3);
       }

       /* === Start Tugmasi === */
       .btn-start {
          width: 100%;
          padding: 16px;
          background: linear-gradient(138deg, var(--red), var(--yellow));
          border: none;
          border-radius: 12px;
          color: #fff;
          font-family: 'Poppins', sans-serif;
          font-size: 1.2rem;
          font-weight: 700;
          letter-spacing: 2px;
          cursor: pointer;
          box-shadow: 0 5px 15px rgba(218, 44, 77, 0.3);
          text-transform: uppercase;
       }
       .btn-start:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 25px rgba(218, 44, 77, 0.5);
       }
       .btn-start:active { transform: translateY(0); }
       .btn-start:disabled { opacity: 0.6; cursor: not-allowed; }

       @media (max-width: 500px) {
          .form-row { flex-direction: column; gap: 0; }
          .container { padding: 30px 20px; }
          .radio-group { flex-direction: column; }
       }
    </style>
</head>
<body>

  <a href="/4000_essential_english_words/" class="btn-back">⬅️ Back</a>

  <div class="theme-switch-wrapper">
    <label class="theme-switch" for="checkbox">
        <input type="checkbox" id="checkbox" />
        <div class="slider">
            <span>🌙</span>
            <span>☀️</span>
        </div>
    </label>
  </div>

  <div class="container">

      <div class="title-section">
          <!-- Sarlavhaga kitob nomini dinamik chiqarish uchun ID berdik -->
          <h2 style="color: var(--red);" id="form-title">To suit your taste:</h2>
      </div>

      <!-- Xatoliklar paneli -->
      <div id="alert-box" class="alert-message"></div>

      <form id="quiz-settings-form">
          <!-- Django CSRF Token (Muammosiz ishlashi uchun) -->
          <input type="hidden" id="csrf_token" value="{{ csrf_token }}">

          <!-- Tanlangan kitob raqami uchun yashirin input -->
          <input type="hidden" name="book" id="book" value="1">

          <div class="form-row">
              <div class="form-group">
                  <label>From Unit:</label>
                  <input type="number" name="from_unit" id="from_unit" value="1" min="1" max="30">
              </div>

              <div class="form-group">
                  <label>To Unit:</label>
                  <input type="number" name="to_unit" id="to_unit" value="30" min="1" max="30">
              </div>
          </div>

          <div class="form-group">
              <label>Number of tests (Amount):</label>
              <input type="number" name="amount" id="amount" value="5" min="1" max="250">
          </div>

          <div class="radio-group">
              <div class="radio-box">
                  <input type="radio" name="language" id="language-eng" value="eng-uzb" checked>
                  <label class="radio-label" for="language-eng">eng - uzb</label>
              </div>
              <div class="radio-box">
                  <input type="radio" name="language" id="language-uzb" value="uzb-eng">
                  <label class="radio-label" for="language-uzb">uzb - eng</label>
              </div>
          </div>

          <button type="submit" class="btn-start" id="submit-btn">Start Quiz</button>
      </form>
  </div>

  <script>
    // === 1. Tungi/Kunduzgi rejim (Theme Switch) ===
    const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
    const currentTheme = localStorage.getItem('theme');

    if (currentTheme) {
        document.documentElement.setAttribute('data-theme', currentTheme);
        if (currentTheme === 'light') {
            toggleSwitch.checked = true;
        }
    }

    function switchTheme(e) {
        if (e.target.checked) {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
        } else {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    }
    toggleSwitch.addEventListener('change', switchTheme, false);


    // === 2. Yangi Yagona API manzili ===
    const API_URL = "/api/query_essential/";

    async function loadCurrentSettings() {
        // Avvalgi oynada foydalanuvchi tanlagan kitobni aniqlaymiz
        const selectedBook = localStorage.getItem('selected_book') || "1";
        document.getElementById('book').value = selectedBook;
        document.getElementById('form-title').innerText = `Book ${selectedBook} Settings:`;

        try {
            const response = await fetch(API_URL, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
            });
            if (response.ok) {
                const resData = await response.json();
                if (resData.success && resData.current_settings) {
                    const settings = resData.current_settings;

                    // Agar bazada avvaldan saqlangan sozlama bo'lsa formaga yuklaymiz
                    if(settings.from_unit !== null) document.getElementById('from_unit').value = settings.from_unit;
                    if(settings.to_unit !== null) document.getElementById('to_unit').value = settings.to_unit;
                    if(settings.amount !== null) document.getElementById('amount').value = settings.amount;

                    if (settings.language === 'uzb-eng') {
                        document.getElementById('language-uzb').checked = true;
                    } else {
                        document.getElementById('language-eng').checked = true;
                    }
                }
            }
        } catch (error) {
            console.error("Sozlamalarni yuklashda xatolik yuz berdi:", error);
        }
    }

    document.addEventListener("DOMContentLoaded", loadCurrentSettings);


    // === 3. POST so'rov (Saqlash va Keyingi qadam) ===
    const form = document.getElementById('quiz-settings-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerText = "Saving...";

        alertBox.style.display = 'none';
        alertBox.className = 'alert-message';

        const book = document.getElementById('book').value;
        const from_unit = document.getElementById('from_unit').value;
        const to_unit = document.getElementById('to_unit').value;
        const amount = document.getElementById('amount').value;
        const language = document.querySelector('input[name="language"]:checked').value;

        const csrfToken = document.getElementById('csrf_token').value || getCookie('csrftoken');

        const requestData = {
            book: parseInt(book),
            from_unit: parseInt(from_unit),
            to_unit: parseInt(to_unit),
            amount: parseInt(amount),
            language: language
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify(requestData)
            });

            const data = await response.json();

            if (response.status === 200 && data.success) {
                alertBox.textContent = data.message || "Settings saved successfully!";
                alertBox.classList.add('alert-success');
                alertBox.style.display = 'block';

                setTimeout(() => {
                    // Test sahifasiga yo'naltirish
                    window.location.href = data.next_step_url || "/test_essential/";
                }, 1200);

            } else {
                alertBox.textContent = data.message || "Validation error occurred!";
                alertBox.classList.add('alert-danger');
                alertBox.style.display = 'block';

                submitBtn.disabled = false;
                submitBtn.innerText = "Start Quiz";
            }

        } catch (error) {
            alertBox.textContent = "Server connection error! Please try again.";
            alertBox.classList.add('alert-danger');
            alertBox.style.display = 'block';

            submitBtn.disabled = false;
            submitBtn.innerText = "Start Quiz";
        }
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
  </script>

</body>
</html>
